# What the next release says of the two components it ships.
#
# A release promotes the digests main.yml committed (`scripts/pin.sh
# --release X.Y.Z`), so no component version is named here. `rollback_safe` is
# `true` only when the component's previous release can run on what this one
# leaves behind; the bundle declares both together. The pull request that
# prepares a release sets them, beside `bundle/RELEASE.md`.
backend:
  rollback_safe: false
frontend:
  rollback_safe: false
