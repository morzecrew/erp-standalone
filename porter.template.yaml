schemaType: Bundle
schemaVersion: 1.0.1

# ....................... #
# Metadata

name: standalone
version: 0.0.0
registry: ghcr.io/morzecrew/erp

# ....................... #
# High-level configuration

dockerfile: dockerfile.tpl
mixins:
  - exec

# ....................... #
# Images

images:
  frontend:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/frontend
    digest: __LOCK__

  backend:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/backend
    digest: __LOCK__
  
  migrations:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/migrations
    digest: __LOCK__

# ....................... #
# Credentials

credentials:
  - name: secrets-env
    path: /home/nonroot/secrets_env
    applyTo:
      - install
      - upgrade

  - name: gh-token
    path: /home/nonroot/gh-token
    applyTo:
      - install
      - upgrade

# ....................... #
# Parameters

parameters:
  - name: port
    type: integer
    default: 8030
    description: Port for the gateway
    env: GATEWAY_PORT
    applyTo:
      - install
      - upgrade
  
  - name: namespace
    type: string
    default: erp
    description: Namespace for the services
    env: COMPOSE_PROJECT_NAME
    applyTo:
      - install
      - upgrade
      - uninstall

# ....................... #
# Commands

customActions:
  scaffold:
    stateless: true
    modifies: false

scaffold:
  - exec:
      command: bash
      arguments:
        - -ceu
        - cp -n /scaffold/* /out/

install:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
      description: Install bundle
      command: just
      arguments: 
        - install
  
upgrade:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
      description: Upgrade bundle
      command: just
      arguments:
        - upgrade

uninstall:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
      description: Uninstall bundle
      command: just
      arguments: 
        - uninstall