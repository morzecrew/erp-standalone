schemaType: Bundle
schemaVersion: 1.0.1

# ....................... #
# Metadata

name: standalone
version: 0.0.0
registry: ghcr.io/morzecrew/erp

# ....................... #
# High-level configuration

dockerfile: tpl.Dockerfile
mixins:
  - exec

# ....................... #
# Images

images:
  frontend:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/frontend
    digest: __LOCK__

  backend:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/backend
    digest: __LOCK__
  
  migrations:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/migrations
    digest: __LOCK__

  postgres:
    imageType: docker
    repository: ghcr.io/morzecrew/erp/postgres
    digest: __LOCK__

# ....................... #
# Credentials

credentials:
  - name: secrets_env
    path: /home/nonroot/secrets_env

# ....................... #
# Parameters

parameters:
  - name: destroy-volumes
    type: boolean
    default: false
    description: Wipe volumes on uninstall

  - name: port
    type: integer
    default: 8030
    description: Port for the gateway

# ....................... #
# Commands

install:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
        POSTGRES_IMAGE: ${ bundle.images.postgres.repository }@${ bundle.images.postgres.digest }
        GATEWAY_PORT: ${ bundle.parameters.port }
      description: Install bundle
      command: just
      arguments: 
        - install
  
upgrade:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
        POSTGRES_IMAGE: ${ bundle.images.postgres.repository }@${ bundle.images.postgres.digest }
        GATEWAY_PORT: ${ bundle.parameters.port }
      description: Upgrade bundle
      command: just
      arguments:
        - upgrade

uninstall:
  - exec:
      envs:
        FRONTEND_IMAGE: ${ bundle.images.frontend.repository }@${ bundle.images.frontend.digest }
        BACKEND_IMAGE: ${ bundle.images.backend.repository }@${ bundle.images.backend.digest }
        MIGRATIONS_IMAGE: ${ bundle.images.migrations.repository }@${ bundle.images.migrations.digest }
        POSTGRES_IMAGE: ${ bundle.images.postgres.repository }@${ bundle.images.postgres.digest }
        GATEWAY_PORT: ${ bundle.parameters.port }
      description: Uninstall bundle
      command: just
      arguments: 
        - uninstall
        - ${ bundle.parameters.destroy-volumes }