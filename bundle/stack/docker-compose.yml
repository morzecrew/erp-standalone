x-service: &service
  restart: "unless-stopped"
  logging:
    options:
      max-size: 5m
      max-file: 3

# ....................... #

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

# ....................... #

services:
  postgres:
    <<: *service
    image: ghcr.io/morzecrew/postgres:18-cron-pgroonga
    volumes:
        - postgres-data:/var/lib/postgresql/docker
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

    healthcheck:
      <<: *healthcheck
      test: 
        - CMD-SHELL
        - pg_isready -U postgres -h localhost -p 5432
  
  # ....................... #

  pgbouncer:
    <<: *service
    image: edoburu/pgbouncer:v1.25.1-p0
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: ${POSTGRES_DB:-postgres}

      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256

      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 30
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10

      ADMIN_USERS: ${POSTGRES_USER:?}
      STATS_USERS: ${POSTGRES_USER:?}
    
    healthcheck:
      <<: *healthcheck
      test:
        - CMD-SHELL
        - pg_isready -h localhost -p 6432 -U $$DB_USER || psql -p 6432 -U $$DB_USER pgbouncer -b -c 'SHOW USERS' >/dev/null
  
  # ....................... #

  migrations:
    <<: *service
    image: ${MIGRATIONS_IMAGE:?}
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      FLYWAY_USER: ${POSTGRES_USER:?}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/postgres
      FLYWAY_CONNECT_RETRIES: "60"
  
  # ....................... #

  valkey:
    <<: *service
    image: valkey/valkey:9.0
    command: valkey-server --requirepass "${REDIS_PASSWORD:?}"
    volumes:
      - valkey-data:/data

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "valkey-cli", "-h", "localhost", "ping"]
  
  # ....................... #

  minio:
    <<: *service
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server --address :9000 --console-address :9001 /data
    volumes:
      - minio-data:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]
  
  # ....................... #

  temporal:
    <<: *service
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?}
      POSTGRES_SEEDS: postgres

    healthcheck:
      <<: *healthcheck
      test: 
        - CMD-SHELL
        - temporal operator namespace describe --namespace default --address temporal:7233 || exit 1
  
  # ....................... #

  backend:
    <<: *service
    image: ${BACKEND_IMAGE:?}
    command: api
    depends_on: &backend_deps
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    
    environment: &backend_env
      # Postgres
      POSTGRES__USER: ${POSTGRES__USER:?}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:?}
      POSTGRES__DATABASE: ${POSTGRES__DATABASE:?}
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USE_PGBOUNCER: ${POSTGRES__USE_PGBOUNCER:?}
      POSTGRES__PGBOUNCER_HOST: pgbouncer
      POSTGRES__PGBOUNCER_PORT: 6432

      # Redis
      REDIS__PASSWORD: ${REDIS__PASSWORD:?}
      REDIS__HOST: valkey
      REDIS__PORT: 6379

      # S3
      S3__USER: ${S3__USER:?}
      S3__PASSWORD: ${S3__PASSWORD:?}
      S3__HOST: minio
      S3__PORT: 9000

      # Temporal
      TEMPORAL__HOST: temporal
      TEMPORAL__PORT: 7233

      # API
      API__PORT: 80
      API__WORKERS: 4
      API__ROOT_PATH: /api

    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
  
  # ....................... #

  background:
    <<: *service
    image: ${BACKEND_IMAGE:?}
    command: bg
    depends_on: *backend_deps
    environment: *backend_env
    
  # ....................... #

  frontend:
    <<: *service
    image: ${FRONTEND_IMAGE:?}

  # ....................... #

  gateway:
    <<: *service
    build:
      context: ./caddy
    volumes:
      - caddy-data:/data

    ports:
      - ${GATEWAY_PORT:-8030}:80
  
# ....................... #

volumes:
  postgres-data:
    driver: local
  
  valkey-data:
    driver: local

  minio-data:
    driver: local
  
  caddy-data:
    driver: local