# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
#
# Every secret reaches its services as a 0400 file, so a service that does not
# run as root reads one only when `owner` gives it the file. The backend,
# worker and bootstrap run as 65532, and the pgbouncer and rustfs images read
# their secrets as root before dropping to their own user, so every non-root
# reader here is 65532; postgres, valkey and flyway start as root and read any
# file.
#
# `init` generates every infrastructure secret, and one value has one
# declaration: the readers of a value share the one declaration that holds it.
# `admin_password` is the only secret without a generator, which the operator
# sets.
#
# `services` is what a rotation restarts. The one-shots, flyway and bootstrap,
# read their files afresh on every run and are never listed.
api_version: selfhost/v1alpha1

secrets:
  - name: postgres_password
    description: Password of the postgres role, read by postgres, PgBouncer and the backend
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [postgres, pgbouncer, backend, worker]

  - name: valkey_password
    description: Password Valkey requires of every client
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [valkey, backend, worker]
    rotation_period: 2160h

  - name: rustfs_secret_key
    description: RustFS secret key, read by rustfs, the backend and the worker
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [rustfs, backend, worker]

  - name: access_secret_key
    description: Key the backend signs access tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  - name: refresh_pepper
    description: Pepper the backend hashes refresh tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  # Rotating it revokes every API key, so nothing suggests it.
  - name: api_key_pepper
    description: Pepper the backend hashes API keys with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]

  - name: admin_password
    description: Password bootstrap gives the first administrator
    required: true
    owner: "65532"
