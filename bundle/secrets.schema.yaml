# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
#
# Every secret reaches its services as a 0400 file, so a service that does not
# run as root reads one only when `owner` gives it the file. The backend,
# worker and bootstrap run as 65532, pgbouncer as its image's postgres (70) and
# rustfs as 10001; postgres, valkey and flyway start as root and read any file.
#
# A file has one owner, so a secret with two non-root readers is two
# declarations, and the operator sets both from one value:
#
#   postgres_password  = pgbouncer_password
#   s3_secret_key      = rustfs_secret_key
#
# `services` is what a rotation restarts. The one-shots, flyway and bootstrap,
# read their files afresh on every run and are never listed.
api_version: selfhost/v1alpha1

secrets:
  - name: postgres_password
    description: Password of the postgres role; set pgbouncer_password to the same value
    required: true
    owner: "65532"
    services: [postgres, backend, worker]

  - name: pgbouncer_password
    description: The postgres role's password as PgBouncer holds it; the same value as postgres_password
    required: true
    owner: "70"
    services: [pgbouncer]

  - name: valkey_password
    description: Password Valkey requires of every client
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [valkey, backend, worker]
    rotation_period: 2160h

  - name: s3_secret_key
    description: RustFS secret key as the backend holds it; set rustfs_secret_key to the same value
    required: true
    owner: "65532"
    services: [backend, worker]

  - name: rustfs_secret_key
    description: RustFS secret key; the same value as s3_secret_key
    required: true
    owner: "10001"
    services: [rustfs]

  - name: access_secret_key
    description: Key the backend signs access tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  - name: refresh_pepper
    description: Pepper the backend hashes refresh tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  # Rotating it revokes every API key, so nothing suggests it.
  - name: api_key_pepper
    description: Pepper the backend hashes API keys with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]

  - name: admin_password
    description: Password bootstrap gives the first administrator
    required: true
    owner: "65532"
