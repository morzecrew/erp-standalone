# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
#
# The whole ERP as one morzer release: erp-backend, erp-frontend and their
# infrastructure behind one Caddy edge.
api_version: selfhost/v1alpha1
kind: application-release
metadata:
  name: erp
  # Stamped by `morzer release build --version`, never by hand.
  version: 0.0.0
  description: Morze ERP -- backend, frontend and infrastructure behind one edge
  vendor: morzecrew
  release_notes: RELEASE.md
providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}
runtimes:
  compose:
    files:
      - compose/compose.yaml
    options:
      # Every volume lives under this name; changing it orphans the data.
      project: erp
requirements:
  architectures: [amd64]
  tools:
    # The first releases that mount an image as a volume, with a subpath:
    # Engine 28.0.0 (API 1.48) and Compose v2.35.0. flyway reads the
    # migrations that way.
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 4GiB
  disk: 20GiB
  ports:
    - "{{ .Parameters.http_port }}"
    - "{{ .Parameters.https_port }}"
    - "{{ .Parameters.health_port }}"
parameters:
  http_port:
    type: port
    default: 80
    description: Port the edge serves HTTP on
    services: [edge]
  https_port:
    type: port
    default: 443
    description: Port the edge serves HTTPS on
    services: [edge]
  health_port:
    type: port
    default: 8081
    description: Loopback port the edge serves plain HTTP on, for health checks
    services: [edge]
  api_workers:
    type: int
    default: 2
    description: API worker processes in the backend
    services: [backend]
  log_level:
    type: enum
    values: [debug, info, warning, error]
    default: info
    description: Log verbosity of the backend and the worker
    services: [backend, worker]
  assistant_enabled:
    type: bool
    default: false
    description: Serve the assistant chat, which sends questions and the data it reads to assistant_base_url
    services: [backend, worker]
  assistant_base_url:
    type: string
    default: https://api.deepseek.com
    description: The assistant's OpenAI-compatible endpoint
    services: [backend, worker]
  assistant_model:
    type: string
    default: deepseek-flash
    description: The model the assistant asks its endpoint for
    services: [backend, worker]
# Infrastructure pinned by digest as `repo:tag@sha256:`, the tag kept for
# Renovate: the digests erp-backend's compose and its flyway base pin, so what
# its CI tests is what ships. The three components carry `main` and an all-zero digest until
# bundle-ci's pin.sh writes their real digests.
images:
  postgres: ghcr.io/morzecrew/postgres:18.6@sha256:d02f8ccb7d0d6e191b8996b1b40beba2fc1b425f10dbadcfcc5722ceded55e9b
  pgbouncer: ghcr.io/morzecrew/pgbouncer:1.26.1@sha256:6b7fb128ebbf6e8520743bee3e020ee0bc9cf010e37e4145c6a1c3238cb513fe
  valkey: ghcr.io/morzecrew/valkey:9.1@sha256:3d63c89ea031c58e9dfb21054fff70b17927dcb310ff2304c182d9de78b41576
  rustfs: ghcr.io/morzecrew/rustfs:1.0.4@sha256:70a17071fedd76f2d5378b1226825f43e03c28d14b8d844d1c8b1e41dec67a73
  flyway: ghcr.io/morzecrew/flyway:13.11@sha256:c9802bd2a962f5ec7980b5f483ecdeb959aae14a332c1f73df305854ce795014
  caddy: ghcr.io/morzecrew/caddy:2.11.7@sha256:fa5515ca8c92cfc1731a518da984834ff5fceb8bf3380bf453a60f9710d47c9f
  backend: ghcr.io/morzecrew/erp-backend:main@sha256:6686cfa2a29b1b80f6ed7c553363dba2a1ee18e81f8ea2e2f639640d63d74036
  migrations: ghcr.io/morzecrew/erp-migrations:main@sha256:34bb7b5ce756b4c9518a1c5e980058fb16d207b8a97f0c8d3e35b639a9cd16d9
  frontend: ghcr.io/morzecrew/erp-frontend:main@sha256:8c44b1251dee1f4c8a12c527ce0dda92616349b23098e66600c5176d2c6d9f26
secrets:
  source: /etc/erp/secrets.sops.yaml
  render_to: /run/erp/secrets
  schema: secrets.schema.yaml
operations:
  # All four steps run on every apply and update, before services start, and
  # all are harmless to repeat: db-password sets the role to the value the
  # apply already rendered, flyway with nothing pending exits 0, bootstrap
  # keeps the catalogs and admin that exist, and schema-version only reads.
  # No step seeds data.
  migrate:
    # First, ahead of flyway and every other step that connects: flyway and the
    # services behind PgBouncer authenticate as `postgres` with the rendered
    # `postgres_password`, so a rotation of that secret reaches the role only
    # if the role carries it before anything connects with it as that.
    - kind: hook
      command: ["hooks/db-password"]
      timeout: 2m
    - kind: runtime-service
      service: flyway
      timeout: 15m
    - kind: runtime-service
      service: bootstrap
      timeout: 5m
    # morzer records each release's `schema_at_install` from this step, so
    # `rollback`, `update`'s compatibility check and the unattended gate judge
    # against the schema the database holds rather than warning that it is
    # unknown.
    - kind: hook
      command: ["hooks/schema-version"]
      timeout: 1m
  smoke_test:
    kind: hook
    command: ["hooks/smoke-test"]
    timeout: 5m
# What an operator runs by name with `morzer task run`, through the backend
# image's entrypoint, which loads the `*_FILE` secrets.
tasks:
  seed:
    description: "Fill an empty database with demo data (-- --size xs|s|m|l --seed N)"
    service: backend
    command: [seed]
    args: true
    modes: [dev]
    timeout: 30m
  repair:
    description: Give back to free stock what closed or deleted plans still hold
    service: backend
    command: [repair]
backup:
  volumes:
    # Postgres and Valkey stop together, so a restore never pairs Valkey's
    # number_id counters with a database holding higher numbers.
    postgres-data: {consistency: cold}
    valkey-data: {consistency: cold}
    rustfs-data: {consistency: cold}
    # Certificates and ACME state, written once and read back.
    edge-data: {consistency: hot}
# Both on the edge's loopback health port, which always serves plain HTTP.
health:
  checks:
    - name: edge
      type: http
      url: "http://127.0.0.1:{{ .Parameters.health_port }}/__platform_healthz"
      timeout: 5s
      start_period: 60s
    - name: api
      type: http
      url: "http://127.0.0.1:{{ .Parameters.health_port }}/health"
      timeout: 5s
      start_period: 120s
compatibility:
  # The migrations image's `tech.morze.erp.schema` label, written by
  # bundle-ci's pin.sh; 0 until it runs. Each release reads only the schema it
  # produces.
  database_schema_produces: 44
  database_schema_min: 44
  database_schema_max: 44
  # Between two releases on one schema -- where `database_schema_min` = `max` =
  # `produces` -- morzer rolls back, and returns from a failed update by itself
  # (exit 11). Across a schema change it refuses the rollback, naming the
  # pre-update backup, and a failed update stops at exit 12 for a restore.
  # bundle-ci's `pin.sh --release` writes this from components.yaml's
  # `backend.rollback_safe` and `frontend.rollback_safe` together, true only
  # when both are; a plain pin leaves it as committed.
  rollback_safe: true
  # The first manager that reads `tasks:`, and whose `update` generates a
  # secret a release adds.
  min_manager_version: "0.8.0"
retention:
  releases: 3
  backups: 7
