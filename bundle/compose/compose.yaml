# The ERP behind one origin. `edge` is the only service that publishes ports;
# everything else talks on the project network.
#
# Compose sees only what morzer gives it: ERP_IMAGE_<KEY> for each pinned
# image, ERP_PARAM_<NAME> for each parameter, ERP_SECRETS_DIR, ERP_RELEASE_DIR,
# ERP_DOMAIN (absent without --domain) and ERP_VERSION. An image is named only
# through its ERP_IMAGE_ variable, so what runs is what the manifest pins.
#
# Secrets reach a container only as files under /run/secrets, read through a
# *_FILE variable; secrets.schema.yaml gives each file to the user that reads it.

# The backend's settings, shared by backend, worker and bootstrap. It names only
# files all three are given: envfile-exec exits 78 on one it cannot read.
x-backend-environment: &backend-environment
  APP__LOG_LEVEL: ${ERP_PARAM_LOG_LEVEL:-info}
  # Through PgBouncer, on the image's transaction pooling and pool of 30.
  POSTGRES__USE_PGBOUNCER: "true"
  POSTGRES__PGBOUNCER_HOST: pgbouncer
  POSTGRES__PGBOUNCER_PORT: 6432
  POSTGRES__HOST: postgres
  POSTGRES__PORT: 5432
  POSTGRES__USER: postgres
  # erp-backend's settings ignore an unknown name, and envfile-exec reads a
  # `*_FILE` only for the names its image lists, so each name here is theirs.
  POSTGRES__DATABASE: erp
  POSTGRES__PASSWORD_FILE: /run/secrets/postgres_password
  REDIS__HOST: valkey
  REDIS__PORT: 6379
  REDIS__PASSWORD_FILE: /run/secrets/valkey_password
  S3__HOST: rustfs
  S3__PORT: 9000
  S3__USER: erp
  S3__PASSWORD_FILE: /run/secrets/rustfs_secret_key
  AUTH__ACCESS_SECRET_KEY_B64_FILE: /run/secrets/access_secret_key
  AUTH__REFRESH_PEPPER_B64_FILE: /run/secrets/refresh_pepper
  AUTH__API_KEY_PEPPER_B64_FILE: /run/secrets/api_key_pepper
  # One origin: the edge serves the API and the frontend together, so there is
  # no cross-origin caller to allow and no cookie domain to widen.
  AUTH__COOKIE_DOMAIN: ""
  AUTH__ALLOWED_ORIGINS: "[]"
  # The chat is off until the operator sets the endpoint's key and turns it on;
  # its questions and the data its tools read go to that endpoint.
  ASSISTANT__ENABLED: ${ERP_PARAM_ASSISTANT_ENABLED:-false}
  ASSISTANT__BASE_URL: ${ERP_PARAM_ASSISTANT_BASE_URL:-https://api.deepseek.com}
  ASSISTANT__MODEL: ${ERP_PARAM_ASSISTANT_MODEL:-deepseek-flash}
  ASSISTANT__API_KEY_FILE: /run/secrets/assistant_api_key

x-backend-depends-on: &backend-depends-on
  pgbouncer:
    condition: service_healthy
  valkey:
    condition: service_healthy
  rustfs:
    condition: service_healthy

services:
  postgres:
    image: ${ERP_IMAGE_POSTGRES}
    restart: unless-stopped
    environment:
      # Not `erp`: the role's name heads the search path, where it would shadow
      # the `erp` schema the migrations create and name objects by.
      POSTGRES_USER: postgres
      POSTGRES_DB: erp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # A large allocation is mapped, and handed back once freed. With glibc's
      # defaults each backend kept the most its queries had ever used, and 30
      # pooled backends held 6.4–7.3 GiB on a 4 GiB host under a steady load.
      # With these and the pool of 20 below, 2.1–2.3 GiB at the same throughput.
      GLIBC_TUNABLES: glibc.malloc.mmap_threshold=131072:glibc.malloc.trim_threshold=131072
      # The image's small-instance settings.
      PG_CONF__shared_buffers: 128MB
      PG_CONF__maintenance_work_mem: 64MB
      PG_CONF__min_wal_size: 80MB
      PG_CONF__max_wal_size: 1GB
    configs:
      # pg_cron is created in the application's database, and the image points
      # it at `postgres`. A dotted key cannot travel through PG_CONF__.
      - source: postgres-cron
        target: /etc/postgresql/conf.d/13-cron.conf
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  pgbouncer:
    image: ${ERP_IMAGE_PGBOUNCER}
    restart: unless-stopped
    environment:
      PGBOUNCER_DB_HOST: postgres
      PGBOUNCER_DB_USER: postgres
      PGBOUNCER_DB_PASSWORD_FILE: /run/secrets/postgres_password
      # A cold backup stops Postgres; PgBouncer holds the failure it saw until
      # these expire. One second each, so it serves clients again about two
      # seconds after Postgres is ready instead of refusing them with a cached
      # error.
      PGBOUNCER_CONF__server_login_retry: 1
      PGBOUNCER_CONF__dns_max_ttl: 1
      PGBOUNCER_CONF__dns_nxdomain_ttl: 1
      # 20 server connections, not the image's 30: each idle backend still holds
      # its caches. At 12, writes queued behind each other and throughput fell
      # by a fifth; at 20 it held. The 10 in reserve open past a 5 s wait.
      PGBOUNCER_CONF__default_pool_size: 20
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--port=6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: ${ERP_IMAGE_VALKEY}
    restart: unless-stopped
    environment:
      # Durable, not a cache: the login lockout counters, the requirements
      # recalculation lock and the realtime stream live here; the number_id
      # counters moved to Postgres with the rows they number. AOF loses at most a
      # second of writes, and a full memory refuses writes rather than evicting.
      VALKEY_PERSISTENCE: aof
      VALKEY_MAXMEMORY_POLICY: noeviction
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    secrets:
      - valkey_password
    volumes:
      - valkey-data:/data
    deploy:
      resources:
        limits:
          # maxmemory follows this; without it the image falls back to 256 MiB.
          memory: 1g
    healthcheck:
      # Authenticated, so a valkey that refuses its own password is unhealthy.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: ${ERP_IMAGE_RUSTFS}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: erp
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    secrets:
      - rustfs_secret_key
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${ERP_IMAGE_BACKEND}
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *backend-environment
      API__WORKERS: ${ERP_PARAM_API_WORKERS:-2}
    secrets: &backend-secrets
      - postgres_password
      - valkey_password
      - rustfs_secret_key
      - access_secret_key
      - refresh_pepper
      - api_key_pepper
      - assistant_api_key
    depends_on: *backend-depends-on
    healthcheck:
      # The image has no shell, curl or wget; its own Python asks the API.
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ${ERP_IMAGE_BACKEND}
    restart: unless-stopped
    command: ["bg"]
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on: *backend-depends-on

  frontend:
    image: ${ERP_IMAGE_FRONTEND}
    restart: unless-stopped
    environment:
      # The release morzer installed, which the sidebar shows (/config.json).
      VITE_RELEASE_VERSION: ${ERP_VERSION:-}
    healthcheck:
      # The caddy base image's health route, on the frontend's own address.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__platform_healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge:
    image: ${ERP_IMAGE_CADDY}
    restart: unless-stopped
    environment:
      # With --domain, HTTPS on the domain and HTTP redirected to it; without
      # one, plain HTTP. :8081 is always plain HTTP, for morzer's checks.
      CADDY_EDGE_ADDRESS: "${ERP_DOMAIN:-:80}, :8081"
      CADDY_AUTO_HTTPS: "on"
      # A 50 MiB attachment passes; past 51 MiB is a 413. The WAF follows it.
      CADDY_REQUEST_BODY_MAX_SIZE: 51MiB
      # Logs what CRS would refuse and blocks nothing, until it is tuned.
      CADDY_WAF_ENGINE: DetectionOnly
    ports:
      - "${ERP_PARAM_HTTP_PORT:-80}:80"
      - "${ERP_PARAM_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${ERP_PARAM_HEALTH_PORT:-8081}:8081"
    volumes:
      - ${ERP_RELEASE_DIR:?ERP_RELEASE_DIR is set by morzer}/edge/erp.caddy:/etc/caddy/config.d/erp.caddy:ro
      # Certificates: losing them means asking Let's Encrypt again.
      - edge-data:/data
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/__platform_healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The migrate steps. `up` leaves the `ops` profile out; morzer's
  # `docker compose run` still reaches them.

  flyway: &flyway
    image: ${ERP_IMAGE_FLYWAY}
    profiles: [ops]
    restart: "no"
    command: ["migrate"]
    environment:
      # Straight to Postgres: flyway's session locks break under transaction
      # pooling.
      FLYWAY_URL: jdbc:postgresql://postgres:5432/erp
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD_FILE: /run/secrets/postgres_password
      FLYWAY_CONNECT_RETRIES: 10
      # As erp-backend's own stack runs them: unprefixed versioned files, and
      # repeatables below, found by a recursive scan.
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_SQL_MIGRATION_PREFIX: ""
      FLYWAY_SQL_MIGRATION_SUFFIXES: .sql,.psql
      FLYWAY_OUTPUT_QUERY_RESULTS: "false"
    secrets:
      - postgres_password
    volumes:
      # The migrations ship as data in their own image, never baked into
      # flyway's.
      - type: image
        source: ${ERP_IMAGE_MIGRATIONS}
        target: /flyway/sql
        image:
          subpath: flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap: &bootstrap
    image: ${ERP_IMAGE_BACKEND}
    profiles: [ops]
    restart: "no"
    command: ["bootstrap"]
    environment:
      <<: *backend-environment
      # Only here: in the shared settings it would stop the backend and worker,
      # which are never given the file.
      APP__ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - postgres_password
      - valkey_password
      - rustfs_secret_key
      - access_secret_key
      - refresh_pepper
      - api_key_pepper
      - assistant_api_key
      - admin_password
    depends_on: *backend-depends-on

  # A dev machine's fresh start, by `morzer task run reset`: the task runs `reset`,
  # and Compose runs the chain before it — the database dropped and made again,
  # every Valkey key but the realtime stream deleted, the migrations, the
  # bootstrap, then the seed with the task's arguments, as a first apply and a
  # `seed` would. The backend and worker keep running: FORCE ends their sessions,
  # their pools reconnect to the new database, and the worker's stream group stays.
  # pg_cron's launcher, ended with the database, restarts by itself and finds its
  # jobs once the migrations made them again. Files in RustFS stay, no record
  # pointing at them; a task runs in a container and cannot empty a volume.

  reset-wipe:
    image: ${ERP_IMAGE_POSTGRES}
    profiles: [reset]
    restart: "no"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        PGPASSWORD=$$(cat /run/secrets/postgres_password)
        export PGPASSWORD
        psql --host=postgres --username=postgres --dbname=postgres -v ON_ERROR_STOP=1 <<'SQL'
        DROP DATABASE IF EXISTS erp WITH (FORCE);
        CREATE DATABASE erp;
        SQL
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  # Caches, lockouts and the recalculation lock go with the records they stood
  # for; the stream stays, its consumer group made only when the worker starts.
  reset-valkey:
    image: ${ERP_IMAGE_VALKEY}
    profiles: [reset]
    restart: "no"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        VALKEYCLI_AUTH=$$(cat /run/secrets/valkey_password)
        export VALKEYCLI_AUTH
        cli() { valkey-cli --no-auth-warning -h valkey "$$@"; }
        cli --scan | while read -r key; do
          [ "$$(cli type "$$key")" = stream ] || cli del "$$key" >/dev/null
        done
    secrets:
      - valkey_password
    depends_on:
      valkey:
        condition: service_healthy
      reset-wipe:
        condition: service_completed_successfully

  reset-migrate:
    <<: *flyway
    profiles: [reset]
    depends_on:
      reset-valkey:
        condition: service_completed_successfully

  reset-bootstrap:
    <<: *bootstrap
    profiles: [reset]
    depends_on:
      pgbouncer:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      reset-migrate:
        condition: service_completed_successfully

  # The seed, its demo users signing in with the admin's password.
  reset:
    <<: *bootstrap
    profiles: [reset]
    command: ["seed"]
    depends_on:
      reset-bootstrap:
        condition: service_completed_successfully

configs:
  postgres-cron:
    content: |
      cron.database_name = 'erp'

secrets:
  postgres_password:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/postgres_password
  valkey_password:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/valkey_password
  rustfs_secret_key:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/rustfs_secret_key
  access_secret_key:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/access_secret_key
  refresh_pepper:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/refresh_pepper
  api_key_pepper:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/api_key_pepper
  assistant_api_key:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/assistant_api_key
  admin_password:
    file: ${ERP_SECRETS_DIR:-/run/erp/secrets}/admin_password

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
  edge-data:
