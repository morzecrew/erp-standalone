# Memory / planner
PG_CONF__max_connections = 60
PG_CONF__shared_buffers = 1GB
PG_CONF__effective_cache_size = 4GB
PG_CONF__work_mem = 16MB
PG_CONF__maintenance_work_mem = 256MB
PG_CONF__temp_buffers = 8MB

# CPU / parallelism
PG_CONF__max_worker_processes = 8
PG_CONF__max_parallel_workers = 8
PG_CONF__max_parallel_workers_per_gather = 2
PG_CONF__max_parallel_maintenance_workers = 2
PG_CONF__effective_io_concurrency = 200
PG_CONF__maintenance_io_concurrency = 16

# WAL / checkpoints
PG_CONF__wal_buffers = -1
PG_CONF__wal_compression = on
PG_CONF__min_wal_size = 1GB
PG_CONF__max_wal_size = 4GB
PG_CONF__checkpoint_timeout = 15min
PG_CONF__checkpoint_completion_target = 0.9
PG_CONF__checkpoint_flush_after = 256kB
PG_CONF__wal_writer_delay = 200ms
PG_CONF__wal_writer_flush_after = 1MB

# Autovacuum
PG_CONF__autovacuum = on
PG_CONF__autovacuum_max_workers = 5
PG_CONF__autovacuum_naptime = 10s
PG_CONF__autovacuum_vacuum_cost_limit = 2000
PG_CONF__autovacuum_vacuum_cost_delay = 2ms
PG_CONF__autovacuum_work_mem = -1

# Timeouts
PG_CONF__statement_timeout = 0
PG_CONF__idle_in_transaction_session_timeout = 0
PG_CONF__lock_timeout = 0
PG_CONF__deadlock_timeout = 1s

# Logging
PG_CONF__log_min_duration_statement = 200ms
PG_CONF__log_statement = none
PG_CONF__log_checkpoints = on
PG_CONF__log_autovacuum_min_duration = 10s
PG_CONF__log_lock_waits = off
PG_CONF__log_temp_files = -1
PG_CONF__log_connections = ''
PG_CONF__log_disconnections = off
PG_CONF__log_line_prefix = '%m [%p] '