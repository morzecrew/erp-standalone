  - id: A-17
    at: '2026-10-29T18:53:36Z'
    title: a smoke hook change rebuilds the dev channel
    changes:
      - subject: D-17
        field: text
        before: >-
          `main.yml` runs on `repository_dispatch` `component-published`, on a push
          to `bundle/**` or `components.yaml`, by hand, and every six hours, in one
          concurrency group that never cancels. It re-resolves every component's `main`
          and never trusts the payload; a changed pin is committed as `⬆️ build(deps):
          bump <components> to <sha7s>` with `GITHUB_TOKEN` and pushed, rebasing and
          re-resolving on a lost race.
        after: >-
          `main.yml` runs on `repository_dispatch` `component-published`, on a push
          to `bundle/**`, `components.yaml` or `.github/smoke.d/**`, by hand, and
          every six hours, in one concurrency group that never cancels. It re-resolves
          every component's `main` and never trusts the payload; a changed pin is
          committed as `⬆️ build(deps): bump <components> to <sha7s>` with `GITHUB_TOKEN`
          and pushed, rebasing and re-resolving on a lost race.
      - subject: D-17
        field: fingerprint
        after: 707bc4ba2ee4d758/a2ae58da4858baa1
    md: >-
      A smoke hook is part of what a dev bundle is tested with, so a change under
      `.github/smoke.d` rebuilds the dev channel.
