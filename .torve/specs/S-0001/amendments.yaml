  - id: A-12
    at: '2026-10-29T17:10:37Z'
    title: a release promotes the committed pins
    changes:
      - subject: D-15
        field: text
        before: >-
          `scripts/resolve.sh` resolves an image tag to its digest and reads the migrations
          image's schema label; `scripts/pin.sh` writes the component pins and `database_schema_produces`
          into `bundle/manifest.yaml`. `components.yaml` names the backend's and frontend's
          `X.Y.Z`, `rollback_safe` and notes; the migrations follow the backend's
          version. In release mode `pin.sh` refuses `main` and `sha-*` tags.
        after: >-
          `scripts/resolve.sh` resolves an image tag or digest to its digest and reads
          the migrations image's schema label; `scripts/pin.sh` writes the component
          pins and `database_schema_produces` into `bundle/manifest.yaml`. The dev
          channel pins each component's `main`, the migrations beside the backend.
          `scripts/pin.sh --release X.Y.Z` resolves no tag: it keeps each digest the
          committed manifest pins under the tag `bundle-X.Y.Z`, and refuses a version
          that is not `X.Y.Z`, the all-zero placeholder and a digest the registry
          no longer holds. `components.yaml` holds only each component's `rollback_safe`.
      - subject: D-15
        field: fingerprint
        after: 555964c7768a2e2a/6b0f5a9892461c23
    md: >-
      A release promotes a dev build instead of assembling component releases. `pin.sh
      --release X.Y.Z` keeps the digests `main.yml` committed, which the dev channel
      installed and smoke-tested, under the tag `bundle-X.Y.Z`. The components are
      no longer tagged or rebuilt for a release, and `components.yaml` keeps only
      `rollback_safe`. D-28 keeps the promoted images from the components' retention.
