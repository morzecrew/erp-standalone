  - id: A-7
    at: '2026-10-28T15:00:33Z'
    title: Smoke tests run inside a rig of their own
    changes:
      - subject: D-19
        field: text
        before: >-
          A bundle is smoke-tested on the runner before it is published, in jobs with
          `packages: read`: a fresh `sudo morzer init` and `apply`, then a backup
          and a restore (S-0002/D-5); and, when the caller's channel tag exists (`:stable`
          for `release.yml`, `:main` otherwise, S-0002/D-6), an `init` from that published
          bundle, `morzer update` to the new archive, and `morzer rollback` back to
          it or its refusal for the right reason. Each probes the loopback health
          port. Publishing is a separate job with `packages: write` that needs the
          smoke jobs.
        after: >-
          A bundle is smoke-tested before it is published, in jobs with `packages:
          read`, each inside a rig of its own on the runner (S-0004/D-5): a fresh
          `sudo morzer init` and `apply`, then a backup and a restore (S-0002/D-5);
          and, when the caller's channel tag exists (`:stable` for `release.yml`,
          `:main` otherwise, S-0002/D-6), an `init` from that published bundle, `morzer
          update` to the new archive, and `morzer rollback` back to it or its refusal
          for the right reason. Each probes the rig's loopback health port. Publishing
          is a separate job with `packages: write` that needs the smoke jobs.
      - subject: D-19
        field: fingerprint
        before: 9d40300eab58079b/a2ae58da4858baa1
        after: f1e7e3a0607a1d35/a2ae58da4858baa1
    md: >-
      S-0004 moves CI to the org's self-hosted runners, which are shared with other
      repositories and outlive a job, so a smoke test can no longer install the ERP
      on the runner itself. Each smoke job now runs the same operations inside a privileged
      `docker:29.7.2-dind` rig of its own, removed with its volume when the job ends
      (S-0004/D-5). The checks are unchanged. Only where they run moves, and the probed
      loopback is the rig's.
  - id: A-8
    at: '2026-10-28T15:11:19Z'
    title: The bundle needs morzer 0.7.0
    changes:
      - subject: D-1
        field: text
        before: >-
          The bundle is a morzer `application-release` named `erp`, format `selfhost/v1alpha1`,
          declaring `compatibility.min_manager_version: "0.6.0"`, Compose as its runtime
          and `sops-age` for secrets. Its files are `bundle/manifest.yaml`, `secrets.schema.yaml`,
          `compose/compose.yaml`, `edge/erp.caddy`, `hooks/smoke-test` and `RELEASE.md`.
        after: >-
          The bundle is a morzer `application-release` named `erp`, format `selfhost/v1alpha1`,
          declaring `compatibility.min_manager_version: "0.7.0"` (S-0005/D-1), Compose
          as its runtime and `sops-age` for secrets. Its files are `bundle/manifest.yaml`,
          `secrets.schema.yaml`, `compose/compose.yaml`, `edge/erp.caddy`, `hooks/smoke-test`
          and `RELEASE.md`.
      - subject: D-1
        field: fingerprint
        after: fa58430dd0791a27/8fb1b1cb2a761aec
    md: >-
      S-0005 raises the bundle's floor to morzer 0.7.0, which fixes the four bugs
      the README and the smoke tests worked around (morzer#134, #135, #139, #142).
      The README stops carrying those workarounds, so a 0.6.0 machine following it
      would end with its timers stopped and no volume helper. Refusing to load there
      is the better failure. No customer machine exists yet.
  - id: A-9
    at: '2026-10-29T06:49:39Z'
    title: the bundle can turn the assistant on
    changes:
      - subject: D-8
        field: text
        before: >-
          `valkey_password` is generated (`password`); `access_secret_key`, `refresh_pepper`
          and `api_key_pepper` are generated `base64` of 32 bytes; `postgres_password`
          and `rustfs_secret_key` are generated `password` of 32 (S-0003/D-1); `admin_password`
          is set by the operator. `api_key_pepper` and `postgres_password` have no
          `rotation_period`.
        after: >-
          `valkey_password` is generated (`password`); `access_secret_key`, `refresh_pepper`
          and `api_key_pepper` are generated `base64` of 32 bytes; `postgres_password`
          and `rustfs_secret_key` are generated `password` of 32 (S-0003/D-1); `assistant_api_key`
          is generated `password` of 32, a placeholder the operator replaces with
          the endpoint's key to turn the assistant on; `admin_password` is set by
          the operator. `api_key_pepper` and `postgres_password` have no `rotation_period`.
      - subject: D-8
        field: fingerprint
        before: ffdce6038f960d37/a42b45ae3c100f0f
        after: 4e4d8060e81c4c8a/a42b45ae3c100f0f
    md: >-
      erp-backend's assistant chat is off until `ASSISTANT__ENABLED`, and its API
      refuses to start when it is on with no key. The bundle set neither, so every
      install hid the «Ассистент» tab. The backend and worker now read `ASSISTANT__API_KEY_FILE`.
      Compose starts no service whose secret file is missing, and envfile-exec exits
      78 on a file it cannot read, so the file must always exist: `init` generates
      a placeholder, which the operator replaces with the endpoint's key. morzer generates
      secrets only at `init`, so a machine installed earlier runs `morzer secret generate
      assistant_api_key` once before the update; the README says so, and the smoke
      update does it.
  - id: A-10
    at: '2026-10-29T06:49:40Z'
    title: the assistant's parameters
    changes:
      - subject: D-25
        field: text
        before: >-
          The parameters are `http_port` (80), `https_port` (443) and `health_port`
          (8081) for `edge`, `api_workers` (2) for `backend`, and `log_level` (`debug`,
          `info`, `warning`, `error`; `info`) for `backend` and `worker`.
        after: >-
          The parameters are `http_port` (80), `https_port` (443) and `health_port`
          (8081) for `edge`, `api_workers` (2) for `backend`, `log_level` (`debug`,
          `info`, `warning`, `error`; `info`) for `backend` and `worker`, and the
          assistant's `assistant_enabled` (`false`), `assistant_base_url` (`https://api.deepseek.com`)
          and `assistant_model` (`deepseek-flash`) for `backend` and `worker`.
      - subject: D-25
        field: fingerprint
        after: 074ad7b741624e6b/b6b3b43e2ac1f7b1
    md: >-
      The assistant's switch, endpoint and model are parameters, so turning it on
      or moving it to another OpenAI-compatible host is `morzer config set`, which
      re-creates the backend and the worker. The defaults are erp-backend's own. Turning
      it on sends the questions, and the data the assistant's tools read, to that
      endpoint.
