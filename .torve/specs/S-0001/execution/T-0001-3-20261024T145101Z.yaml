entries:
  - decision: D-23
    grade: OPEN
    at: '2026-10-24T14:36:40Z'
    claim: >-
      requirements.tools records docker >=28.0.0 and compose >=2.35.0. Docker Engine
      28.0.0 (API 1.48) added the image mount with an image subpath; Compose v2.35.0
      introduced volume.type=image with image.subpath. A digest reference is an ordinary
      image reference to both, and morzer pulls every pinned ref before migrate, so
      no later fix is needed for the repo@sha256 form: 29.0.0 fixed mounting one image
      at several targets, 29.1.4 long mount paths, 29.7.0 only dropped the experimental
      warning, and Compose v5.4.0 only taught config --resolve-image-digests to pin
      tag sources.
    evidence: >-
      `curl -fsSL https://raw.githubusercontent.com/docker/docs/main/content/manuals/engine/release-notes/28.md
      | grep -n 'type=image'` — 731: Add ability to mount an image inside a container
      via --mount type=image (under ## 28.0.0); 732: --mount type=image,image-subpath=[subpath];
      and `curl -fsSL 'https://api.github.com/repos/docker/compose/releases?per_page=100'
      | jq -r '.[]|select(.body|test("type=image"))|.tag_name'` prints v2.35.0 (Introduce
      volume.type=image, docker/compose#12725) and v5.4.0 (pin type:image volume sources,
      #13956)
    action: decided
    proposal: >-
      D-23 settled: requirements.tools docker >=28.0.0, compose >=2.35.0.
  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-24T14:36:40Z'
    claim: >-
      The backend's settings names beyond the seven the rows give are not in the contract,
      and erp-backend and its images are private to this sandbox. compose.yaml infers
      them from the GROUP__FIELD convention the rows use (POSTGRES__HOST/PORT/USER/DB/PASSWORD_FILE,
      VALKEY__HOST/PORT/PASSWORD_FILE, S3__ENDPOINT_URL/ACCESS_KEY/SECRET_KEY_FILE/BUCKET,
      AUTH__ACCESS_SECRET_KEY_FILE/REFRESH_PEPPER_FILE/API_KEY_PEPPER_FILE, APP__LOG_LEVEL,
      API__WORKERS), with the commands api, bg and bootstrap from the design. None
      of these names is verified; edge-smoke stands the backend in and cannot catch
      a wrong one, only CI's smoke test can. The S3 access key id is a plain value
      (erp), since D-8 lists no secret for it.
    evidence: >-
      `grep -rhoE '[A-Z]+__[A-Z_]+' .torve/specs/S-0001` — prints only POSTGRES__USE_PGBOUNCER,
      POSTGRES__PGBOUNCER_HOST, POSTGRES__PGBOUNCER_PORT, APP__ADMIN_PASSWORD_FILE,
      APP__VERSION, AUTH__COOKIE_DOMAIN, AUTH__ALLOWED_ORIGINS; and `docker buildx
      imagetools inspect ghcr.io/morzecrew/erp-backend:main` fails 401 Unauthorized
    action: decided
    proposal: >-
      A row naming the backend's environment: every settings variable compose.yaml
      sets for backend, worker and bootstrap, the seven *_FILE names envfile-exec
      resolves, the S3 access key id and bucket, and the variable api_workers and
      log_level map to — taken from erp-backend's own compose stack.
