  - decision: unlisted
    grade: UNLISTED
    at: '2026-10-24T14:36:40Z'
    claim: >-
      The migrations need two things of the database that no row states. pg_cron is
      created in the baseline, and the postgres image pins cron.database_name to postgres,
      which its env channel cannot change (sh drops dotted names, and cron.* is not
      allowlisted); compose.yaml mounts an inline Compose config at /etc/postgresql/conf.d/13-cron.conf
      setting cron.database_name = 'erp'. And the role must not be named erp: with
      "$user" on the search path, an erp role renders regclass names unqualified and
      0003 drops a trigger that does not exist. The role is postgres and the database
      erp, which applies all 53 migrations to v0032.
    evidence: >-
      `docker run ... -e POSTGRES_USER=erp -e POSTGRES_DB=erp ghcr.io/morzecrew/postgres:18.6;
      docker run ... erp-e2e-flyway:latest migrate` — ERROR: can only create extension
      in database postgres; with the 13-cron.conf fragment: ERROR: trigger trg_rev_bump_caf7086514
      for table stage_bom does not exist; with POSTGRES_USER=postgres and the fragment:
      Successfully applied 53 migrations to schema public, now at version v0032
    action: decided
    proposal: >-
      A row: the database is erp, owned by the role postgres, with cron.database_name
      = 'erp' mounted into the postgres image's conf.d.
  - decision: unlisted
    grade: UNLISTED
    at: '2026-10-24T14:36:40Z'
    claim: >-
      The migrations are named 0001__baseline.sql, with no V prefix, and flyway's
      default prefix would find none of them. erp-backend's e2e flyway build sets
      FLYWAY_SQL_MIGRATION_PREFIX to empty, FLYWAY_SQL_MIGRATION_SUFFIXES=.sql,.psql
      and FLYWAY_OUTPUT_QUERY_RESULTS=false; the migrations image is SQL only and
      carries no environment, so the flyway service sets the same three, with FLYWAY_LOCATIONS=filesystem:/flyway/sql,
      which flyway scans recursively.
    evidence: >-
      `docker image inspect erp-e2e-flyway:latest --format '{{json .Config.Env}}'`
      — [..., FLYWAY_SQL_MIGRATION_PREFIX=, FLYWAY_SQL_MIGRATION_SUFFIXES=.sql,.psql,
      FLYWAY_OUTPUT_QUERY_RESULTS=false, ...]; its /flyway/sql/postgres holds 0001__baseline.sql
      to 0032__unpriced_line_count.sql and repeatable/R__*.sql
    action: decided
    proposal: >-
      D-3 adds: flyway runs with an empty migration prefix, suffixes .sql,.psql and
      locations filesystem:/flyway/sql, as erp-backend's e2e stack does.
