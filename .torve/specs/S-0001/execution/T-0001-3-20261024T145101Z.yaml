    action: decided
    proposal: >-
      D-1 adds: bundle/.gitignore keeps the engine's AGENTS.md files out of the bundle
      and out of the hooks the shellcheck gate reads. Or narrow the gate's pathspec
      with ':(exclude)**/AGENTS.md' and drop the ignore.
