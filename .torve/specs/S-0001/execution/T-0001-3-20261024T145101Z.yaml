  - decision: unlisted
    grade: UNLISTED
    kind: blocked
    class: spec-gap
    at: '2026-10-24T14:46:13Z'
    attempt: 2
    claim: >-
      The shellcheck gate cannot pass in this scope. Its file list globs 'bundle/hooks/*',
      which takes in bundle/hooks/AGENTS.md, the managed file the engine renders into
      every governed directory (D-12 governs bundle/hooks/**). shellcheck refuses
      markdown as a script (SC2148, SC1089 parse error), and a parse error cannot
      be disabled. The hook's path is fixed by D-12, the AGENTS.md is the engine's
      and comes back on every render, and the gate lives in .torve/gates.yaml, outside
      scope.allow. Every other gate is green: acceptance, compose-config, edge-smoke
      (every route, 50 MiB -> 200, past 51 MiB -> 413), and morzer release build plus
      verify --render-check run by hand, since git cannot resolve this worktree inside
      the sandbox and bundle-verify.sh stops at git ls-files.
    evidence: >-
      `shellcheck -S warning bundle/hooks/AGENTS.md` — In bundle/hooks/AGENTS.md line
      1: SC2148 Tips depend on target shell; SC1089 Parsing stopped here; .torve/gates.yaml:60
      is the gate whose file list is `git ls-files ... -- '*.sh' 'bundle/hooks/*'`,
      and bundle/hooks/AGENTS.md:1 is the torve:managed marker
    action: halted
    proposal: >-
      Amend the shellcheck gate in .torve/gates.yaml to exclude the managed file,
      e.g. pathspec ':(exclude)bundle/hooks/AGENTS.md' (or ':(exclude)**/AGENTS.md'),
      or select hooks by shebang, then re-mint T-0001. The bundle files in this tree
      need no change.
    notes: >-
      Attempt 1's ignored-writes leftovers under .torve/tmp/pgt were removed. The
      other .torve/tmp files are the engine's.
