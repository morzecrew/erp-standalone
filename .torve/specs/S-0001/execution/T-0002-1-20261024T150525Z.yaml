entries:
  - decision: D-15
    grade: ASSUMED
    kind: departed
    at: '2026-10-24T15:01:27Z'
    claim: >-
      yq re-emits the whole document when it edits one value, so the first pin drops
      the blank lines between the manifest sections: changing nothing else holds for
      every key, value and comment, but not for the blank-line layout.
    evidence: >-
      `yq -i "." bundle/manifest.yaml` on a copy of the committed file — output deletes
      the 12 blank lines at 7, 15, 20, 28, 43, 71, 85, 90, 106, 116, 130 and 141 and
      changes nothing else; every comment and value survives, and a second run is
      byte-identical
    action: departed
  - decision: D-13
    grade: ASSUMED
    at: '2026-10-24T15:01:27Z'
    claim: >-
      the migrations schema label is zero-padded and the three compatibility.database_schema_*
      fields are integers, so the pin records the number the label names rather than
      a string a YAML reader could take for octal.
    evidence: >-
      scripts/pin.sh:135 — the label is normalised to the integer it names before
      the three fields are written
    action: decided
  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-24T15:01:32Z'
    claim: >-
      D-15 fixes what the resolver prints but not its shape; the resolver prints the
      digest on line 1 and schema=<value> on line 2 when the image carries the label,
      which is what the pin parses.
    evidence: >-
      scripts/resolve.sh:46-57 — line 1 is the digest of the tag, and the schema line
      is printed only when the image carries the label
    action: decided
    proposal: >-
      D-15 gains: scripts/resolve.sh prints the digest of a repo:tag on line 1 and,
      when the image carries the tech.morze.erp.schema label, schema=<value> on line
      2, and nothing else; scripts/pin.sh parses those two lines.
    notes: >-
      PIN_ROOT and RESOLVE point the pin at another tree and another resolver, which
      is how tests/pin/run.sh replaces resolve.sh with a fixture and reaches no registry.
