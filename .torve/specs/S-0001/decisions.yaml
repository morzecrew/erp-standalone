# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      The bundle is a morzer `application-release` named `erp`, format `selfhost/v1alpha1`,
      declaring `compatibility.min_manager_version: "0.8.0"` (S-0005/D-1), Compose
      as its runtime and `sops-age` for secrets. Its files are `bundle/manifest.yaml`,
      `secrets.schema.yaml`, `compose/compose.yaml`, `edge/erp.caddy`, `hooks/smoke-test`
      and `RELEASE.md`.
    paths: [bundle/manifest.yaml, bundle/RELEASE.md]
    consequence: >-
      Compose sees `ERP_IMAGE_<KEY>`, `ERP_PARAM_<NAME>`, `ERP_SECRETS_DIR`, `ERP_RELEASE_DIR`,
      `ERP_DOMAIN` and `ERP_VERSION` and nothing else; a manager older than 0.6.0
      says it is too old instead of failing on `owner`
    rationale: >-
      morzer 0.6.0 is the latest release and the first with secret `owner` (CHANGELOG
      0.6.0), which every non-root reader here needs. Decoding is strict, so an unknown
      field is an error, not a silent default.
    fingerprint: 07f3afcddb5cba3e/8fb1b1cb2a761aec
  - id: D-2
    grade: ASSUMED
    text: >-
      Every image is pinned as `repo:tag@sha256:<digest>` under `images:`, and the
      Compose file names an image only as `${ERP_IMAGE_<KEY>}`. Until the pin scripts
      run, the three component images carry their `main` tag and an all-zero digest.
    paths: [bundle/manifest.yaml, bundle/compose/compose.yaml]
    consequence: >-
      morzer pulls exactly the pinned refs before migrate, and Renovate and the pin
      scripts read the tag beside each digest
    rationale: >-
      morzer refuses a bare tag and accepts a tag with a digest (`internal/domain/manifest.go`).
      Agents cannot read the private component packages, so the bundle phase cannot
      resolve their digests; the pin scripts and CI do.
  - id: D-3
    grade: ASSUMED
    text: >-
      The components are `backend` (`ghcr.io/morzecrew/erp-backend`), `migrations`
      (`ghcr.io/morzecrew/erp-migrations`, SQL only, labelled `tech.morze.erp.schema`)
      and `frontend` (`ghcr.io/morzecrew/erp-frontend`). `flyway` mounts the migrations
      image at `/flyway/sql` as a Compose `type: image` volume with `subpath: flyway/sql`.
    paths: [bundle/manifest.yaml, bundle/compose/compose.yaml]
    consequence: >-
      the migrations ship as data beside the flyway image, never baked into it, and
      their schema number is readable without running them
    rationale: >-
      erp-backend #115 migrated 53 files to v0032 through this mount, by tag. A digest
      source is what morzer substitutes, so phase 1 checks that form too.
  - id: D-4
    grade: ASSUMED
    text: >-
      The infrastructure images are `ghcr.io/morzecrew/postgres:18.6`, `pgbouncer:1.26.1`,
      `valkey:9.1`, `rustfs:1.0.4`, `flyway:13.11` and `caddy:2.11.8`, each reading
      its credential from a `*_FILE` variable.
    paths: [bundle/manifest.yaml]
    consequence: >-
      one family of images with the same secret and settings conventions as erp-backend's
      own compose stack
    rationale: >-
      `valkey:9.2` was built on 9.2.0-rc1, whose RDB 9.1 cannot read, and was withdrawn
      (platform-images #70). Upstream `rustfs/rustfs` accepts its default credential;
      the platform image refuses it. flyway moved to 13.11 in platform-images #96.
    fingerprint: 475ead2512540389/b6b3b43e2ac1f7b1
  - id: D-5
    grade: ASSUMED
    text: >-
      The backend, worker and bootstrap reach Postgres through `pgbouncer` (`POSTGRES__USE_PGBOUNCER:
      "true"`, `POSTGRES__PGBOUNCER_HOST: pgbouncer`, `POSTGRES__PGBOUNCER_PORT: 6432`),
      on the image's transaction pooling with its pool of 20 and 10 in reserve. Postgres
      runs with the image's glibc `mmap_threshold` and `trim_threshold` at 128 KiB
      (`GLIBC_TUNABLES`), so a backend hands back what a query freed. `flyway` connects
      to `postgres` directly.
    paths: [bundle/compose/compose.yaml]
    consequence: >-
      the backend runs in the topology erp-backend's e2e suite tests, and its processes'
      pools of 15 never exhaust Postgres's 60 connections however many API workers
      run
    rationale: >-
      Owner's call (2026-10-23). Two API workers, the worker and bootstrap during
      an update hold up to 60 pool connections, which is all of `max_connections`;
      the pooler takes them all and opens at most 30. Flyway takes session locks,
      which transaction pooling breaks.
    fingerprint: 40a3e11c2151ff64/3769111d435c5001
  - id: D-6
    grade: LOCKED
    text: >-
      Valkey is durable: `VALKEY_PERSISTENCE: aof`, `VALKEY_MAXMEMORY_POLICY: noeviction`,
      `deploy.resources.limits.memory: 1g`, and a health check that authenticates
      with its password file and expects `PONG`.
    paths: [bundle/compose/compose.yaml]
    consequence: >-
      a crash loses at most a second of counter increments, a full memory refuses
      writes instead of evicting a counter, and bootstrap waits for a valkey that
      answers
    rationale: >-
      Every document's `number_id` comes from a valkey counter and is `UNIQUE` in
      the schema, so a lost or evicted counter restarts numbering and every create
      on its route fails. The image's defaults are a cache. Without a limit, `maxmemory`
      falls back to 256 MiB.
  - id: D-7
    grade: ASSUMED
    text: >-
      Secrets reach containers only as files: each service lists the secrets it reads,
      mounted at `/run/secrets/<name>` from `${ERP_SECRETS_DIR:-/run/erp/secrets}`,
      and reads them through `*_FILE` variables; no service is given a secret as a
      plain variable. A secret read by a non-root service is owned by that service's
      user (`owner`). Every non-root reader is 65532: the pgbouncer and rustfs images
      read their secrets as root before dropping to their own user, so each value
      has one declaration (S-0003/D-1, D-2). Only `bootstrap` gets `admin_password`
      and `APP__ADMIN_PASSWORD_FILE`. `APP__VERSION` is not set.
    paths: [bundle/secrets.schema.yaml, bundle/compose/compose.yaml]
    consequence: >-
      every service starts without running as root unless its image starts as root,
      and the backend and worker never name a file they are not given
    rationale: >-
      Compose ignores `uid`, `gid` and `mode` on a file secret, and morzer renders
      `0400`. `envfile-exec` exits 78 on an unreadable file, so the admin password
      in the shared anchor would stop the backend and worker. The image bakes its
      own version.
    fingerprint: eb8dd180c96de7b0/1f2407108bf0d57b
  - id: D-8
    grade: ASSUMED
    text: >-
      `valkey_password` is generated (`password`); `access_secret_key`, `refresh_pepper`,
      `api_key_pepper` and `state_mac_key` are generated `base64` of 32 bytes; `postgres_password`
      and `rustfs_secret_key` are generated `password` of 32 (S-0003/D-1); `assistant_api_key`
      is generated `password` of 32, a placeholder the operator replaces with the
      endpoint's key to turn the assistant on; `admin_password` is set by the operator.
      `api_key_pepper` and `postgres_password` have no `rotation_period`.
    paths: [bundle/secrets.schema.yaml]
    consequence: >-
      `doctor` reports an unset operator secret as a failure, and nothing suggests
      rotating a secret whose rotation revokes every API key or breaks the database
      login
    rationale: >-
      morzer's `base64` length is the count of random bytes, StdEncoding, which the
      backend's `b64decode(validate=True)` reads. Postgres reads its password file
      only at initdb.
    fingerprint: 1874ec7646a36034/a42b45ae3c100f0f
  - id: D-9
    grade: ASSUMED
    text: >-
      `edge` is the only service that publishes ports. `bundle/edge/erp.caddy`, mounted
      into the caddy image's `config.d`, sends `/v1`, `/v1/*`, `/mcp`, `/mcp/*`, `/health`
      and `/.well-known/oauth-protected-resource*` to `backend:8000`, and everything
      else to `frontend:8080`. `AUTH__COOKIE_DOMAIN` is empty and `AUTH__ALLOWED_ORIGINS`
      is `[]`.
    paths: [bundle/edge/**, bundle/compose/compose.yaml]
    consequence: >-
      one origin: no CORS and no cookie domain, and a remote MCP client finds its
      metadata on the API's origin
    rationale: >-
      The frontend calls its own origin when `VITE_BACKEND_HOST` is unset. erp-gateway
      proxies only to the backend, so it cannot be the edge.
  - id: D-10
    grade: ASSUMED
    text: >-
      The edge serves `${ERP_DOMAIN:-:80}, :8081` with `CADDY_AUTO_HTTPS: "on"`, publishes
      `http_port` on 80, `https_port` on 443 and `health_port` on loopback 8081, and
      keeps certificates in the `edge-data` volume. Its memory is capped at 1 GiB
      (`deploy.resources.limits.memory: 1g`), from which the caddy image sets `GOMEMLIMIT`
      to 90%.
    paths: [bundle/compose/compose.yaml]
    consequence: >-
      with `--domain`, HTTPS on the domain and HTTP redirected to it; without one,
      plain HTTP for CI's smoke test, which never signs in; morzer's checks always
      reach plain HTTP on loopback
    rationale: >-
      The auth cookies are `Secure`, so a browser signs in only over HTTPS. The caddy
      image's `on` leaves automatic HTTPS on (platform-images #69). Losing `edge-data`
      means a new certificate and Let's Encrypt's rate limits.
    fingerprint: 2a316355f05c549e/3769111d435c5001
  - id: D-11
    grade: ASSUMED
    text: >-
      `CADDY_REQUEST_BODY_MAX_SIZE` is `51MiB`, and `CADDY_WAF_ENGINE` is `DetectionOnly`.
      `CADDY_WAF_SKIP_PATHS` is `/v1/realtime/events`: a `GET` there, the open screens'
      event stream, skips the WAF, and any other method to it is still inspected.
    paths: [bundle/compose/compose.yaml]
    consequence: >-
      a 50 MiB attachment passes and anything past 51 MiB gets 413; the WAF blocks
      nothing and logs what CRS would refuse, which is the evidence a later document
      tunes it from
    rationale: >-
      erp-backend #122 raised its gateway to 51 MiB for 50 MiB attachments, and the
      caddy image's WAF follows this limit. The owner chose no WAF for now (2026-10-23);
      the image refuses any value but `On` and `DetectionOnly`, and `DetectionOnly`
      blocks nothing.
    fingerprint: 28db8bf8de1b1149/3769111d435c5001
  - id: D-12
    grade: ASSUMED
    text: >-
      `operations.migrate` is `runtime-service` `flyway` (15 m) then `bootstrap` (5
      m); `smoke_test` is the hook `hooks/smoke-test` (5 m), which probes `/__platform_healthz`,
      `/health`, `/v1/openapi.json` and `/` on `127.0.0.1:${ERP_PARAM_HEALTH_PORT}`.
      No step seeds data.
    paths: [bundle/manifest.yaml, bundle/hooks/**]
    consequence: >-
      every `apply` and update migrates and keeps the catalogs and admin that exist
      before services start; any failure is exit 12
    rationale: >-
      `flyway migrate` with nothing to apply exits 0, and `erp bootstrap` keeps what
      exists. A `runtime-service` smoke test is not run as one, so it is a hook.
  - id: D-13
    grade: ASSUMED
    text: >-
      `compatibility.database_schema_produces` is the migrations image's `tech.morze.erp.schema`
      label, and `database_schema_min` and `database_schema_max` equal it. The committed
      manifest says `rollback_safe: true`, and `scripts/pin.sh --release` writes the
      conjunction of `components.yaml`'s two values (S-0002/D-4).
    paths: [bundle/manifest.yaml]
    consequence: >-
      production auto-apply can judge a release, and a release after a schema change
      cannot be rolled back automatically
    rationale: >-
      A `runtime-service` step cannot report a schema. The backend documents no compatibility
      across versions yet, so a release claims only the schema it produces.
    fingerprint: 6b1c56f8e466ca71/b6b3b43e2ac1f7b1
  - id: D-14
    grade: ASSUMED
    text: >-
      `backup.volumes` copies `postgres-data`, `valkey-data` and `rustfs-data` with
      `consistency: cold` and `edge-data` with `hot`; `retention` keeps 3 releases
      and 7 backups. Postgres runs the image's small-instance settings (`PG_CONF__shared_buffers:
      128MB`, `maintenance_work_mem: 64MB`, `min_wal_size: 80MB`, `max_wal_size: 1GB`).
    paths: [bundle/manifest.yaml, bundle/compose/compose.yaml]
    consequence: >-
      Postgres and Valkey are captured in one stop window, so a restore never pairs
      counters older than the numbers in the database; a copy stays near the data's
      size
    rationale: >-
      Owner's call (2026-10-23): cold volumes now, a `pg_dump` hook later. A bundle
      with neither a backup hook nor named volumes fails every update. The baked `min_wal_size`
      of 1 GB made each copy at least a gigabyte against a 20 GiB disk.
  - id: D-16
    grade: ASSUMED
    text: >-
