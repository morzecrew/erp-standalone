    at: '2026-10-24T20:15:11Z'
    claim: >-
      D-7 lists bash, curl, jq, openssl, sudo, zstd and minisign from Alpine, but
      docker:dind's busybox tar cannot unpack zstd, and install-tools.sh (tar --zstd)
      and smoke.sh (tar -I zstd) both need it; rehearse.sh also installs Alpine's
      GNU tar.
    evidence: >-
      scripts/rehearse.sh:133-135 — the apk line adds tar; .github/workflows/scripts/install-tools.sh:54
      runs tar --zstd and .github/workflows/scripts/smoke.sh:136-141 runs tar -I zstd
    action: departed
    proposal: >-
      D-7's Alpine list reads: bash, curl, jq, openssl, sudo, tar, zstd and minisign.
  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-24T20:15:11Z'
    claim: >-
      D-7 does not say which key the --from bundle is trusted with; smoke.sh install
      refuses without one. rehearse.sh reads it from REHEARSE_PUBKEY, a public key
      and no credential, refuses when it is unset, and --help names MINISIGN_DEV_PUBKEY
      for :main and MINISIGN_RELEASE_PUBKEY for :stable.
    evidence: >-
      scripts/rehearse.sh:86-87 — REHEARSE_PUBKEY is required; scripts/rehearse.sh:244
      passes it to smoke.sh install beside the rehearsal key
    action: decided
    proposal: >-
      D-7 adds: REHEARSE_PUBKEY holds the minisign public key that signed the --from
      bundle, and the script refuses when it is unset.
  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-24T20:15:11Z'
    claim: >-
      D-7 says each image is given its name in io.containerd.image.name but not which
      name. rehearse.sh names a pin repo:tag, or repo@digest when it has no tag, fully
      qualified (docker.io/library/ for Hub images), copies it by digest so the loaded
      root keeps the pinned digest, and reaches Docker Hub at registry-1.docker.io.
    evidence: >-
      scripts/rehearse.sh:186-214 — load_image derives the name and the oras source
      from the pin
    action: decided
    proposal: >-
      D-7 adds: an image is named as its pin's repo:tag, or repo@digest when untagged,
      fully qualified, and copied by its digest.
