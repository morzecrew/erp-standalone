  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-24T20:02:13Z'
    attempt: 2
    claim: >-
      The contract's manifest acceptance command cannot run as the shell-side finishing
      check reads it. The projection folds the command across two lines; the check
      reads the contract one line at a time and does not join a folded continuation,
      so /bin/sh is handed a command ending in an unterminated quote and answers 'Syntax
      error: Unterminated quoted string'. Run as the one line it was minted as, the
      same command prints true.
    evidence: >-
      .torve/tasks/T-0011/contract.yaml:42-43 — the manifest acceptance command is
      folded after "hooks/schema-version" and the finishing check takes line 42 alone;
      the same command on one line prints true
    action: decided
    proposal: >-
      An acceptance command must survive the projection as one line: either the projection
      must not fold it, or the finishing check must join a folded continuation before
      running it, so a command naming a path cannot be truncated into a shell syntax
      error.
    notes: >-
      Nothing in the tree is wrong: the wrapped command passes when it is not truncated,
      and the battery's own @task.acceptance reads the contract with a YAML library.
