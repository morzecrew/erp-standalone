    at: '2026-10-24T20:09:15Z'
    claim: >-
      D-5 does not say where morzer 0.6.0's JSON puts the backup id or the installation
      id. The installation id is read as .data.installation_id, the field the binary's
      status struct carries; the backup id falls back through .data.id, .data.backup.id
      and .data.backup_id, and the step dies if none is set.
    evidence: >-
      .github/workflows/scripts/smoke.sh:125-133 — the two jq reads; `grep -aoE '.{60}json:"installation_id".{60}'
      /usr/local/bin/morzer` printed InstallationIDjson:"installation_id" PublicURL
      ... CurrentRelease
    action: decided
    proposal: >-
      Amend D-5 to name the fields: status --json's .data.installation_id, and backup
      --json's backup-id field once a rehearsal shows it, so the fallback chain can
      shrink to one path.
  - decision: unlisted
