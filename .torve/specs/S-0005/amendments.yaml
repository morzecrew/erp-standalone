          `bundle/manifest.yaml` declares `compatibility.min_manager_version: "0.7.0"`.
        after: >-
          `bundle/manifest.yaml` declares `compatibility.min_manager_version: "0.8.0"`,
          the first manager that reads `tasks:` and whose `update` generates a secret
          a release adds.
      - subject: D-1
        field: fingerprint
        after: c5e7c000ca11397d/b6b3b43e2ac1f7b1
    md: >-
      morzer 0.8.0 lets a release declare tasks an operator runs by name, and its
      `update` generates a secret a release adds, which `assistant_api_key` (S-0001/A-9)
      needed by hand under 0.7.0. The bundle declares tasks (S-0001/D-26), and a manifest
      with tasks needs 0.8.0. No customer machine exists yet, so only the dev VM upgrades
      morzer first.
