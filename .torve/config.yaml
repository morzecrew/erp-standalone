# yaml-language-server: $schema=schemas/config.json
# erp-standalone under torve: the seats platform-images and erp-backend run, the
# lab store, and a pull request per document that a person merges.
schema_version: 1
engine: "0.8.0"

runtime:
  adapter: docker
  image: standalone-claude-sandbox:2.1.283-torve0.8.0   # .torve/sandbox/standalone-claude/
  # The gates sandbox gets a Docker daemon of its own, in a privileged side
  # container, for `edge-smoke`; the attempt gets one too, so an agent can run
  # what its gates will. Its egress is the host proxy at the bridge gateway,
  # which `torve doctor` checks.
  docker: nested
  nested:
    roles: [gates, implement]
  sandbox_timeout: 2700      # strictly outside agent_timeout, refused otherwise
  agent_timeout: 2200
  network: host              # this host's egress runs through a local proxy

store:
  adapter: postgres
  dsn_env: TORVE_PG_DSN      # the name of the variable, never the DSN itself
  lease_for: 60
  max_run_duration: 7200

unmeasured_images: allow     # the seat images are torve's, measured over torve's work

poison_ceiling: 3

reap:
  stale_after: 600

promotion:
  landing: pull_request
  auto_merge: true
  quiet_window: 30
  unit: document

scm:
  repo: morzecrew/erp-standalone
  open_pr: true              # credentials are `gh`'s on the host

tiers:
  planner: {harness: fake}
  executor:
    harness: claude-subscription
    model: deepseek-v4.1-flash
    provider: modelstudio
    dialect: anthropic
    reasoning: medium
  # The seat a phase names with `tier_variant: strong`: secrets, signing, and
  # containers that run as root.
  executor.strong:
    harness: claude-subscription
    model: claude-opus-5-5
    provider: anthropic
  reviewer:
    harness: claude-subscription
    profile: review
    model: claude-opus-5-5
    provider: anthropic

broker:
  adapter: local
  mode: endpoint
  cost_tolerance: 0.25

providers:
  default: [anthropic, modelstudio]
  repositories: {}
  never_send: []

review:
  "on": [task_gated]
  blocks_at: blocker         # findings are recorded; only a blocker stops

# No review bot is installed here yet: the engine's Opus reviewer is the review,
# and a person's thread is answered and left to them.
threads:
  enabled: true
  bots: []
  rounds_per_pass: 1

vcs:
  signing_key: /home/misery7100/.ssh/id_github
