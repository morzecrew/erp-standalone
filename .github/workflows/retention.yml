# Keep the bundle package inside the free plan's storage: the last 5 dev
# versions, which a dev VM may still roll back to, and untagged versions for a
# day. `main`, `stable` and every X.Y.Z are never selected. The job is
# bundle-ci's.
name: retention

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retention:
    # The package API is reached with GH_PAT, not GITHUB_TOKEN.
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@2ba5b130e5b8139d00f1cb9a2a16ad5d3939d0e0
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}
