# A pull request's bundle, pinned to every component's `main`, built and
# smoke-tested, and never published. It signs with a key made in the job: the
# dev and release keys are never given to a pull request. The jobs are
# bundle-ci's.
name: pr

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@6f4979607559a375d19c3cc5657a86ef518d89aa # v0.4.0
    with:
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      pin: dev
      signing: ephemeral
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      operator-secrets: admin_password
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
