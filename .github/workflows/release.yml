# The stable channel: a tag `vX.Y.Z` on main promotes the component digests
# the dev channel committed there into `:X.Y.Z`, tags each image
# `bundle-X.Y.Z` so the components' retention keeps it, then moves `:stable`.
# The jobs are bundle-ci's.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@26a7adcabc0c732268b396d5bfbd781a6e0d0f5b
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@26a7adcabc0c732268b396d5bfbd781a6e0d0f5b
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      pin: release
      channel: stable
      signing: release
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      operator-secrets: admin_password
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
      bundle-ci-ref: 26a7adcabc0c732268b396d5bfbd781a6e0d0f5b
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: [bundle]
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@26a7adcabc0c732268b396d5bfbd781a6e0d0f5b
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      images: ${{ needs.bundle.outputs.images }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-ci-ref: 26a7adcabc0c732268b396d5bfbd781a6e0d0f5b
