# The dev channel: pin every component's `main`, commit a changed pin, and
# build and smoke-test it, then publish `:<version>` and move `:main`. The
# jobs are bundle-ci's; this file says when they run and what they may do.
#
# A dispatch only says "look now": the pins are re-resolved from the registry
# and the payload is never read. The schedule catches a dispatch that was lost.
name: main

on:
  repository_dispatch:
    types: [component-published]
  push:
    branches: [main]
    paths:
      - bundle/**
      - components.yaml
      - .github/smoke.d/**
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions: {}

concurrency:
  group: main-bundle
  cancel-in-progress: false

jobs:
  pin:
    permissions:
      contents: write
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/pin.yml@729188c93dc336c6a139a72472a48aece880492b # v0.1.2
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: pin
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@729188c93dc336c6a139a72472a48aece880492b # v0.1.2
    with:
      ref: ${{ needs.pin.outputs.sha }}
      channel: main
      signing: dev
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      operator-secrets: admin_password
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: [pin, bundle]
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@729188c93dc336c6a139a72472a48aece880492b # v0.1.2
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
